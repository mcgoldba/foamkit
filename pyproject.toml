[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foamkit"
version = "0.1.0"
description = "A Pythonic interface to OpenFOAM: read, edit and script cases from Python."
authors = [{name = "Marc Goldbach", email = "mgoldbach@myyahoo.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["openfoam", "cfd", "simulation", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pint",
    "rich",
    "ipython",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["ruff>=0.17.1,<0.18", "mypy>=1.19,<1.21"]

[project.urls]
Home = "https://github.com/mcgoldba/foamkit"

[project.scripts]
fk = "foamkit.__main__:main"
#- Deprecated alias for `fk` (the command was renamed)
pf = "foamkit.__main__:main"
foamkit = "foamkit.__main__:main"

[tool.setuptools.packages.find]
include = ["foamkit*"]

[tool.setuptools.package-data]
foamkit = ["config.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
#- Markdown is not formatted (docs, tickets and agent prompts would churn the baseline)
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[[tool.mypy.overrides]]
#- Third-party stubs use syntax newer than the py39 target (e.g. numpy's `type`
#- statement) and abort the run, so treat them as Any. Scoped to runtime
#- dependencies so the standard library stays type-checked. Keep this list in
#- sync with [project].dependencies by hand.
module = ["numpy", "numpy.*", "pandas", "pandas.*", "matplotlib", "matplotlib.*", "pint", "pint.*", "rich", "rich.*", "IPython", "IPython.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
