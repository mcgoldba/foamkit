[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foamkit"
version = "0.1.0"
description = "A Pythonic interface to OpenFOAM: read, edit and script cases from Python."
authors = [{name = "Marc Goldbach", email = "mgoldbach@myyahoo.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["openfoam", "cfd", "simulation", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pint",
    "rich",
    "ipython",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Home = "https://github.com/mcgoldba/foamkit"

[project.scripts]
fk = "foamkit.__main__:main"
#- Deprecated alias for `fk` (the command was renamed)
pf = "foamkit.__main__:main"
foamkit = "foamkit.__main__:main"

[tool.setuptools.packages.find]
include = ["foamkit*"]

[tool.setuptools.package-data]
foamkit = ["config.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
