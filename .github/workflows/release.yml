name: Build and publish

on: [push, pull_request]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only the pre-release entry may fail without failing the workflow.
    continue-on-error: ${{ matrix.prerelease == true }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 (the minimum) is pinned to ubuntu-24.04 because ubuntu-latest is
        # Ubuntu 26.04, which has no Python 3.9 in setup-python. See the
        # minimum-Python policy in ROADMAP.md Decisions.
        include:
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.15'
            os: ubuntu-latest
          - python-version: '3.9'
            os: windows-latest
          - python-version: '3.15'
            os: windows-latest
          - python-version: '3.16'
            os: ubuntu-latest
            prerelease: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.prerelease == true }}

      - name: Install package and test dependencies
        if: matrix.prerelease != true
        run: python -m pip install -e ".[test]"

      - name: Install package and test dependencies (wheels only)
        # A pre-release Python often lacks wheels; refuse source builds so the
        # job fails fast naming the missing wheel. --no-binary=foamkit takes
        # FoamKit itself back out of --only-binary=:all: (editable checkout);
        # it must come after :all:, which resets both lists. The command is a
        # block scalar because `:all: ` is not valid in a plain YAML value.
        if: matrix.prerelease == true
        run: >-
          python -m pip install --only-binary=:all: --no-binary=foamkit -e ".[test]"

      - name: Run tests
        run: python -m pytest

  tests-passed:
    # The one required test check in branch protection. Matrix entries can be
    # added or renamed without editing the required checks on main.
    name: All tests passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the result of every required test job
        # `needs.test.result` is `success` only if every test job passed or
        # is allowed to fail (the pre-release entry); a failed, cancelled or
        # skipped required job fails this check.
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::The test jobs finished with result '$TEST_RESULT'."
            exit 1
          fi
          echo "All required test jobs passed."

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history and tags, for the release-tag check below
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag, its branch and the CHANGELOG
        # Refuse a tag that would publish the wrong version, a commit that is
        # not on main, or a CHANGELOG missing a merged PR (docs/releasing.md).
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/check_release_tag.py "$GITHUB_REF_NAME" origin/main

      - name: Install build dependencies
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [test, build]
    # Only for pushed version tags (e.g. v0.1.0), and only from this repository.
    if: github.repository == 'mcgoldba/foamkit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/foamkit
    permissions:
      # Required for PyPI trusted publishing (OIDC): no password or token is stored.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
