# Development environment for foamkit.
#   mamba env create -f environment.yml
#   mamba activate foamkit
name: foamkit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - matplotlib
  - pint
  - rich
  - ipython
  - pytest
  - ruff>=0.17.1,<0.18
  - mypy>=1.19,<1.21
  - pip
  - pip:
      - -e .
